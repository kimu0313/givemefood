<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>포장마차 타이쿤</title>
    <link rel="icon" href="icon.svg" />
    <link rel="preload" as="image" href="assets/art/title/loading_1.webp" />
    <link rel="preload" as="image" href="assets/art/title/loading_2.webp" />
    <link rel="preload" as="image" href="assets/art/title/menu.webp" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0f1a;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      canvas.stage {
        position: absolute;
        left: 0;
        top: 0;
        touch-action: none;
      }
      /*
       * 로딩 화면 (2026-11-17 사용자 그림 두 장 "번갈아 가면서 컷 애니메이션처럼 라면이 끓고 있는 것처럼"):
       * 가스불 위 라면 냄비 그림 두 장(assets/art/title/loading_1·2.webp, 원본 web/art_src/loading_ramen_1·2.png 를
       * tools/loading_art.mjs 가 막대 안 채움을 지운 것)을 겹쳐 두고 뒷장을 0.3초마다 껐다 켜서 보글보글 끓는 것처럼.
       * 그림 속 "Loading..." 막대 홈(.ld-track, 자리 = 그림 기준 %) 안에 진행(--p, main.ts 가 0~1)만큼 크림색 채움,
       * 막대 아래엔 돌아가며 나오는 팁. 크기는 16:9 틀 높이 --h 기준.
       */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: #0d0f1a;
        transition: opacity 0.5s ease;
        font-family: var(--lang-fonts, "Jua"), "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        --h: min(100vh, 56.25vw);
        --p: 0;
      }
      #loading.hide {
        opacity: 0;
        pointer-events: none;
      }
      #loading .ld-frame {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--h) * 16 / 9);
        height: var(--h);
        transform: translate(-50%, -50%);
        overflow: hidden;
        background: #3a2a22;
      }
      #loading .ld-img {
        position: absolute;
        inset: 0;
        background: center / 100% 100% no-repeat;
      }
      #loading .ld-img.a { background-image: url("assets/art/title/loading_1.webp"); }
      #loading .ld-img.b { background-image: url("assets/art/title/loading_2.webp"); animation: ld-flip 0.6s steps(1, end) infinite; }
      @keyframes ld-flip {
        0% { opacity: 0; }
        50% { opacity: 1; }
      }
      /* 그림 속 막대 홈 (원본 1672×941 에서 x 1042~1588, y 769~798) */
      #loading .ld-track {
        position: absolute;
        left: 62.321%;
        top: 81.722%;
        width: 32.656%;
        height: 3.188%;
        border-radius: calc(var(--h) * 0.004);
        overflow: hidden;
      }
      #loading .ld-fill {
        height: 100%;
        width: calc(var(--p) * 100%);
        border-radius: calc(var(--h) * 0.004);
        background: linear-gradient(180deg, #fff1d6 0%, #f9daad 45%, #edc893 100%);
        transition: width 0.12s linear;
      }
      #loading.done .ld-fill { filter: brightness(1.08); }
      #loading .ld-tip {
        position: absolute;
        left: 61.5%;
        top: 86.6%;
        width: 34.3%;
        text-align: center;
        font-size: calc(var(--h) * 0.022);
        line-height: 1.3;
        color: #f8e6c6;
        -webkit-text-stroke: calc(var(--h) * 0.005) #23130d;
        paint-order: stroke fill;
        transition: opacity 0.3s;
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .ld-img.b { animation: none; opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <div class="ld-frame">
        <div class="ld-img a"></div>
        <div class="ld-img b"></div>
        <div class="ld-track"><div class="ld-fill"></div></div>
        <div class="ld-tip">팁: 막대가 초록색 '완벽' 구간일 때 꺼내면 손님이 좋아해요</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
